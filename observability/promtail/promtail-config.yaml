server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: smm-server
    static_configs:
      - targets: [localhost]
        labels:
          app: server
          job: smm
          __path__: /var/log/smm/server.log

  - job_name: smm-client
    static_configs:
      - targets: [localhost]
        labels:
          app: client
          job: smm
          __path__: /var/log/smm/client.log

  - job_name: smm-rolled
    static_configs:
      - targets: [localhost]
        labels:
          app: rolled
          job: smm
          __path__: /var/log/smm/*.log

    pipeline_stages:
      - match:
          selector: '{job="smm"}'
          stages:
            - regex:
                expression: '^(?P<ts>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3}) (?P<level>\w+)\s+\[(?P<thread>[^\]]+)\] (?P<logger>\S+) - (?P<msg>.*)$'
            - labels:
                level:
                logger:
            - timestamp:
                source: ts
                format: '2006-01-02 15:04:05.000'
