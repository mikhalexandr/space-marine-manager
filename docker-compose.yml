services:
  postgres:
    image: postgres:16
    container_name: smm-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: smm-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--user", "default", "off",
              "--user", "${REDIS_USERNAME:?REDIS_USERNAME is required}", "on",
              ">${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "~*", "+@all"]
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "${REDIS_USERNAME:?REDIS_USERNAME is required}",
             "--pass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  vault:
    image: hashicorp/vault:1.18
    container_name: smm-vault
    ports:
      - "18200:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - ./vault/config:/vault/config:ro
      - vault-data:/vault/file
    command: vault server -config=/vault/config/vault.hcl
    healthcheck:
      # 501 = not initialized, 503 = sealed - оба означают, что HTTP отвечает
      # 200 = unsealed и работает. Любой из них - значит контейнер жив
      test: ["CMD-SHELL",
             "wget -q -O /dev/null -S http://127.0.0.1:8200/v1/sys/health 2>&1 | grep
             -qE 'HTTP/1\\.[01] (200|429|472|473|501|503)' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  loki:
    image: grafana/loki:3.2.1
    container_name: smm-loki
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3100/ready | grep -q 'ready'"]
      interval: 5s
      timeout: 3s
      retries: 10

  promtail:
    image: grafana/promtail:3.2.1
    container_name: smm-promtail
    volumes:
      - ./logs:/var/log/smm:ro
      - ./observability/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - promtail-data:/tmp
    command: -config.file=/etc/promtail/promtail-config.yaml
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.3.0
    container_name: smm-grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_USERNAME:?GRAFANA_USERNAME is required}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}"
      GF_FEATURE_TOGGLES_ENABLE: "logsExploreTableVisualisation"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy

volumes:
  postgres-data:
    name: smm-postgres-data
  vault-data:
    name: smm-vault-data
  loki-data:
    name: smm-loki-data
  promtail-data:
    name: smm-promtail-data
  grafana-data:
    name: smm-grafana-data
